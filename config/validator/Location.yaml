App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [city, country]
            message: 'Location {{ value }} already exists.'
            errorPath: city
            groups: [create, edit]

    properties:
        city:
            - NotBlank:
                message: 'City is required.'
                groups: [create, edit]
            - Length:
                min: 2
                max: 255
                groups: [create, edit]
        country:
            - NotBlank:
                groups: [create, edit]
            - Choice:
                choices: [PL, US, DE, ES]
                message: 'Choose a valid country.'
                groups: [create, edit]
        latitude:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: -90
                max: 90
                notInRangeMessage: 'Latitude must be between {{ min }} and {{ max }}.'
                groups: [create, edit]
        longitude:
            - NotBlank:
                groups: [create, edit]
            - Range:
                min: -180
                max: 180
                notInRangeMessage: 'Longitude must be between {{ min }} and {{ max }}.'
                groups: [create, edit]
